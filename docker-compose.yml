# ── Project Knowledge Assistant — Docker Compose ───────────────────
# Usage:
#   docker compose up -d --build     # build + start
#   docker compose logs -f           # follow logs
#   docker compose down              # stop (data persists in ./data)
#
# Data (SQLite catalog + ChromaDB + uploads) persists on the host in ./data.

services:
  rag-assistant:
    build: .
    image: rag-assistant:latest
    container_name: rag-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # ChromaDB anonymous telemetry off (local-first privacy)
      - ANONYMIZED_TELEMETRY=False
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
