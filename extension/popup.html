<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Knowledge Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    width: 360px;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 2px;
  }
  .subtitle { font-size: 11px; color: #64748b; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #1e293b;
    border-radius: 8px;
    border: 1px solid #334155;
    margin-bottom: 14px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.ok { background: #22c55e; }
  .status-dot.err { background: #ef4444; }
  .status-dot.chk { background: #f59e0b; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .status-text { font-size: 12px; color: #94a3b8; }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .provider-list {
    margin-bottom: 14px;
  }
  .provider-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    margin-bottom: 6px;
    transition: border-color 0.2s;
  }
  .provider-row:hover { border-color: #475569; }
  .provider-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .provider-icon {
    font-size: 18px;
    flex-shrink: 0;
  }
  .provider-name {
    font-size: 13px;
    font-weight: 500;
    color: #cbd5e1;
  }
  .provider-url {
    font-size: 10px;
    color: #64748b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .provider-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .open-link {
    color: #64748b;
    text-decoration: none;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .open-link:hover { color: #60a5fa; }

  .toggle {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .toggle input { display: none; }
  .toggle-slider {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #334155;
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .toggle-slider::before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: transform 0.3s;
  }
  .toggle input:checked + .toggle-slider {
    background: #3b82f6;
  }
  .toggle input:checked + .toggle-slider::before {
    transform: translateX(18px);
  }

  .section { margin-bottom: 14px; }
  .section label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 5px;
  }
  input[type="text"] {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #1e293b;
    color: #e2e8f0;
    font-size: 13px;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #60a5fa;
    box-shadow: 0 0 0 2px rgba(96,165,250,0.15);
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  button {
    flex: 1;
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  .btn-primary {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
  }
  .btn-secondary {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
  }

  .toast {
    position: fixed;
    bottom: 16px;
    left: 20px;
    right: 20px;
    padding: 8px 12px;
    background: #065f46;
    color: #6ee7b7;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    animation: fadeInOut 2s ease forwards;
  }
  @keyframes fadeInOut {
    0% { opacity:0; transform:translateY(8px); }
    15% { opacity:1; transform:translateY(0); }
    85% { opacity:1; transform:translateY(0); }
    100% { opacity:0; transform:translateY(8px); }
  }
</style>
</head>
<body>
<header>
  <h1>Project Knowledge Assistant</h1>
  <p class="subtitle">Ground AI answers in your project evidence</p>
</header>

<div class="status-row">
  <div class="status-dot chk" id="status-dot"></div>
  <span class="status-text" id="status-text">Checking backend...</span>
</div>

<div class="section-label">AI Providers</div>
<div class="provider-list" id="provider-list">
  <!-- Populated by JS -->
</div>

<div class="section">
  <label for="backend-url">RAG Backend URL</label>
  <input type="text" id="backend-url" placeholder="http://localhost:8000" value="http://localhost:8000">
</div>

<div class="actions">
  <button class="btn-secondary" id="test-btn">Test Connection</button>
  <button class="btn-primary" id="save-btn">Save Settings</button>
</div>

<script src="popup.js"></script>
</body>
</html>
