# ── Publish the pre-built Docker image to GitHub Container Registry ──
# On every push to main (and on v* tags), runs the test suite, then
# builds the image and publishes it to:
#     ghcr.io/chitrangad/rag-assistant
# Tags published:
#   - latest        (main branch)
#   - vX.Y.Z        (semver tags, e.g. v0.1.0 → 0.1.0)
#   - sha-<short>   (every build)

name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Needed for the Buildx `type=gha` cache (restore + save). Without this
  # scope the explicit permissions block sets `actions` to none and the
  # cache silently never works.
  actions: write

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install CPU-only torch first so `pip install .` resolves the small
      # build instead of the multi-GB CUDA one (mirrors the Dockerfile).
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install ".[dev]"

      - name: Run tests
        run: pytest tests/ -q

  docker:
    name: Build & push image to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chitrangad/rag-assistant
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
