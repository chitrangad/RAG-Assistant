# ─────────────────────────────────────────────────────────────────────────────
# RAG Knowledge Assistant — Docker Compose (pre-built image)
#
# Usage:
#   docker compose up -d      # pull the pre-built image from GHCR and start
#   docker compose logs -f    # follow logs
#   docker compose down       # stop (data persists in the data directory)
#
# Configuration lives in the `.env` file in this directory (see `.env.example`).
# To build the image locally instead of pulling it, run:
#   docker build -t ghcr.io/chitrangad/rag-assistant:latest .
# ─────────────────────────────────────────────────────────────────────────────

services:
  rag-assistant:
    image: ghcr.io/chitrangad/rag-assistant:latest
    container_name: rag-assistant
    restart: unless-stopped
    ports:
      # Change the host port via PORT in .env. The container listens on 8000.
      - "${PORT:-8000}:8000"
    volumes:
      # Persistent state: SQLite catalog + ChromaDB + uploads + LLM settings,
      # and the answer model under <data>/models. Lives on the host.
      - "${DATA_DIR:-./data}:/app/data"

      # ── Network shares / local folders ─────────────────────────────────────
      # The container can only see host paths you bind-mount here. Mount your
      # document share at the SAME path you will enter in Admin → Add Source:
      #
      #   - "/mnt/omv-share:/mnt/omv-share:ro"
      #
      # GVFS auto-mounts (/run/user/UID/gvfs/smb-share:server=…,share=…) contain
      # colons, which break the host:container syntax — mount the share at a
      # clean path on the host first (e.g. `mount -t cifs //server/share /mnt/omv-share`),
      # then bind that clean path here. Uncomment and set NETWORK_SHARE_PATH in .env:
      #
      # - "${NETWORK_SHARE_PATH:-/mnt/share}:/mnt/share:ro"
    environment:
      - HOST=0.0.0.0
      # ChromaDB anonymous telemetry off (local-first privacy)
      - ANONYMIZED_TELEMETRY=False
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
